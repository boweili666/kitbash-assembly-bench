<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drone assembly · step by step</title><style>/* SHOW_CSS */</style></head><body>
<div id="halo"></div><div id="stage"></div><div id="vignette"></div>

<header id="head">
  <div class="brand"><b>QAV-S 2 SE</b><span>FRAME · ESC · MOTORS</span></div>
  <div id="counter"><b id="stepNo">1</b><span>/ <i id="stepTotal">44</i></span></div>
</header>

<section id="caption">
  <div id="phase">STEP 1</div>
  <h1 id="title">—</h1>
  <p id="parts">—</p>
  <div id="origin"><i class="dot"></i><span id="originText">captured</span></div>
</section>

<nav id="list" aria-label="Steps"></nav>

<footer id="bar">
  <button id="play" aria-label="Play / pause"><svg viewBox="0 0 20 20" class="ic-play"><path d="M6 4l10 6-10 6z"/></svg><svg viewBox="0 0 20 20" class="ic-pause" hidden><path d="M5 4h3.4v12H5zM11.6 4H15v12h-3.4z"/></svg></button>
  <button id="prev" aria-label="Previous step"><svg viewBox="0 0 20 20"><path d="M12.5 4.5L7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="next" aria-label="Next step"><svg viewBox="0 0 20 20"><path d="M7.5 4.5L13 10l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div id="track"><i id="fill"></i><div id="ticks"></div></div>
  <button id="speed" class="txt">1×</button>
  <button id="explode" class="txt" aria-pressed="false">Exploded</button>
</footer>

<div id="fallback" hidden>This browser cannot open WebGL — try another one.</div>

<script>/* SHOW_DATA */</script><script>/* SHOW_JS */</script></body></html>
