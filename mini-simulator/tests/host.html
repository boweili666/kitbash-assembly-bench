<!doctype html>
<meta charset="utf-8">
<title>mini host</title>
<style>html,body{margin:0;height:100%} iframe{border:0;width:100%;height:100%}</style>
<iframe id="bench" src="../dist/mini-simulator.html?bridge=1&embed=1"></iframe>
<script>
  // 站在 ARISTOS 的位置上:mini 的 bridge 只收父窗口发来的 postMessage,
  // 在 mini 页面里自己 postMessage 会被静默丢掉。自测必须走这一层。
  const frame = document.getElementById('bench');
  window.seen = [];
  window.warns = [];
  window.addEventListener('message', (e) => {
    if (!e.data || !e.data.type) return;
    window.seen.push(e.data.type);
    if (e.data.type === 'kb:warn') window.warns.push(e.data.message);
  });
  window.send = (msg) => frame.contentWindow.postMessage(msg, '*');
</script>
